<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Office</title>
<style>
  @font-face { font-family: 'Pretendard Variable'; font-weight: 45 920; font-style: normal; font-display: swap; src: url('/fonts/PretendardVariable.woff2') format('woff2-variations'); }
  /* 장면 속 엘리베이터 표시등에만 쓰는 픽셀 폰트 */
  @font-face { font-family: 'Galmuri9'; src: url('/fonts/Galmuri9.woff2') format('woff2'); font-display: block; }
  :root {
    --bg: #0e1016; --panel: #14171f; --card: #1b1f2a; --card-hi: #242a39;
    --line: rgba(255,255,255,.07); --line-hi: rgba(255,255,255,.14);
    --ink: #eceef3; --mute: #a3aabb; --dim: #6c7487;
    --live: #8ee06b; --amber: #ffcd75; --red: #ff7a8a;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; display: grid; grid-template-columns: 248px minmax(0, 1fr) 304px;
    background: var(--bg); color: var(--ink);
    font: 13px/1.5 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    letter-spacing: -0.01em; -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; }
  aside { background: var(--panel); overflow: auto; padding: 20px 16px; display: flex; flex-direction: column; gap: 28px; }
  #left { border-right: 1px solid var(--line); }
  #right { border-left: 1px solid var(--line); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; }
  h2 { margin: 0 0 12px; font-size: 12px; font-weight: 600; color: var(--mute); display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  h2 span { font-size: 11px; font-weight: 500; color: var(--dim); font-variant-numeric: tabular-nums; }
  .ava { width: 40px; height: 40px; border-radius: 10px; background: var(--card-hi); display: grid; place-items: center; flex: none; }
  .ava img { width: 20px; height: 32px; image-rendering: pixelated; }
  .ava img.wide { width: 33px; height: 21px; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand b { display: block; font-size: 15px; font-weight: 700; letter-spacing: -0.02em; }
  .brand small { display: block; font-size: 12px; color: var(--dim); }

  .floor { all: unset; box-sizing: border-box; display: grid; grid-template-columns: 38px minmax(0, 1fr) auto; gap: 10px; align-items: center; width: 100%; padding: 10px 12px; margin-bottom: 6px; border-radius: 10px; border: 1px solid transparent; cursor: pointer; transition: background .15s, border-color .15s; }
  .floor:hover { background: var(--card); }
  .floor.sel { background: var(--card); border-color: var(--line-hi); }
  .fno { font-size: 12px; font-weight: 700; text-align: center; padding: 4px 0; border-radius: 6px; background: var(--card-hi); color: var(--dim); font-variant-numeric: tabular-nums; }
  .sel .fno { background: rgba(255,205,117,.14); color: var(--amber); }
  .fmeta b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
  .fmeta small { display: block; font-size: 11.5px; color: var(--dim); }
  .fmeta em { font-style: normal; color: var(--live); font-weight: 500; }
  .lamp { width: 7px; height: 7px; border-radius: 50%; background: #3a4052; }
  .on .lamp { background: var(--live); box-shadow: 0 0 0 3px rgba(142,224,107,.15); }
  .sessions { margin: 2px 0 12px 24px; padding-left: 10px; border-left: 1px solid var(--line-hi); }
  .sessions button { all: unset; box-sizing: border-box; display: flex; align-items: center; gap: 8px; width: 100%; cursor: pointer; padding: 5px 8px; border-radius: 6px; font-size: 12px; color: var(--mute); }
  .sessions button i { width: 6px; height: 6px; border-radius: 50%; background: #3a4052; flex: none; }
  .sessions button i.on { background: var(--live); }
  .sessions button span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sessions button:hover, .sessions button.hl { color: var(--ink); background: var(--card); }

  main { position: relative; display: grid; grid-template-rows: auto minmax(0, 1fr); min-width: 0; }
  #topbar { display: flex; align-items: center; gap: 14px; padding: 14px 20px; background: var(--panel); border-bottom: 1px solid var(--line); min-width: 0; }
  .lcd { font-size: 14px; font-weight: 700; color: var(--amber); background: rgba(255,205,117,.12); padding: 6px 12px; border-radius: 8px; min-width: 52px; text-align: center; font-variant-numeric: tabular-nums; }
  .where { min-width: 0; flex: 1; }
  .where b { display: block; font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .where small { display: block; font-size: 12px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #live { font-size: 12px; font-weight: 600; color: var(--live); display: flex; align-items: center; gap: 7px; padding: 5px 11px; border-radius: 999px; background: rgba(142,224,107,.1); }
  #live i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; animation: pulse 1.6s ease-in-out infinite; }
  #live.off { color: var(--red); background: rgba(255,122,138,.1); }
  @keyframes pulse { 50% { opacity: .35; } }
  #stage {
    position: relative; overflow: hidden; cursor: grab; touch-action: none;
    background: #101119 radial-gradient(#1d2030 1px, transparent 1.6px) 0 0 / 16px 16px;
  }
  #stage.drag { cursor: grabbing; }
  #c { position: absolute; inset: 0; width: 100%; height: 100%; }
  #doors { position: absolute; inset: 0; pointer-events: none; z-index: 3; }
  .door { position: absolute; top: 0; bottom: 0; width: 50%; background: linear-gradient(90deg, #2c3243, #3a4256); transition: transform .34s cubic-bezier(.6, 0, .3, 1); }
  .door.l { left: 0; transform: translateX(-101%); border-right: 1px solid var(--line-hi); }
  .door.r { right: 0; transform: translateX(101%); border-left: 1px solid var(--line-hi); background: linear-gradient(270deg, #2c3243, #3a4256); }
  #doors.closed .door { transform: none; }
  #doorLcd { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); font-size: 22px; font-weight: 700; color: var(--amber); background: rgba(14,16,22,.85); padding: 10px 22px; border-radius: 12px; opacity: 0; transition: opacity .12s; font-variant-numeric: tabular-nums; }
  #doors.closed #doorLcd { opacity: 1; }
  #zoom { position: absolute; left: 16px; bottom: 16px; display: flex; flex-direction: column; gap: 6px; z-index: 2; }
  #zoom button { all: unset; width: 32px; height: 32px; display: grid; place-items: center; cursor: pointer; font-size: 16px; font-weight: 500; color: var(--mute); border-radius: 8px; }
  #zoom button:hover { background: var(--card-hi); color: var(--ink); }
  #hint { position: absolute; right: 16px; bottom: 14px; font-size: 11.5px; color: var(--dim); z-index: 2; }
  #empty { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); padding: 16px 20px; display: none; text-align: center; color: var(--mute); z-index: 2; }
  #tip { position: absolute; pointer-events: none; padding: 10px 12px; display: none; max-width: 300px; z-index: 4; box-shadow: 0 8px 24px rgba(0,0,0,.4); }
  #tip b { display: block; font-weight: 600; }
  #tip small { display: block; font-size: 12px; color: var(--mute); word-break: break-all; margin-top: 2px; }

  .person { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 12px; padding: 12px; margin-bottom: 8px; cursor: pointer; transition: background .15s, border-color .15s; }
  .person:hover { background: var(--card-hi); }
  .person.hl { border-color: rgba(255,205,117,.55); }
  .person b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
  .state { font-size: 12px; color: var(--mute); margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; word-break: break-all; }
  .state.err { color: var(--red); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .chip { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--card-hi); color: var(--mute); }
  .chip.sub { background: rgba(142,224,107,.1); color: var(--live); }
  .log { display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 6px 10px; font-size: 12px; }
  .log time { color: var(--dim); font-variant-numeric: tabular-nums; }
  .log span { color: var(--mute); word-break: break-all; }
  .log em { font-style: normal; font-weight: 600; margin-right: 4px; }
  .legend { display: grid; grid-template-columns: 10px minmax(0, 1fr); gap: 9px 10px; align-items: center; font-size: 12px; color: var(--dim); }
  .legend i { width: 10px; height: 10px; border-radius: 3px; }
  .legend b { color: var(--ink); font-weight: 600; margin-right: 6px; }
  .note { font-size: 12px; color: var(--dim); }
</style>
</head>
<body>
<aside id="left">
  <div class="brand"><div class="ava"><img id="logo" class="wide" alt=""></div><div><b>Claude Office</b><small>Claude Code 실시간 사무실</small></div></div>
  <section><h2>층별 안내 <span>FLOOR GUIDE</span></h2><div id="floorList"></div></section>
</aside>
<main>
  <div id="topbar">
    <div class="lcd" id="lcd">-- F</div>
    <div class="where"><b id="floorName">사무실 준비 중…</b><small id="floorPath"></small></div>
    <div id="live"><i></i>LIVE</div>
  </div>
  <div id="stage">
    <canvas id="c"></canvas>
    <div id="doors"><div class="door l"></div><div class="door r"></div><div id="doorLcd"></div></div>
    <div id="empty" class="card">최근 6시간 안에 활동한<br>Claude Code 세션이 없습니다.</div>
    <div id="tip" class="card"></div>
    <div id="zoom"><button class="card" data-z="1" title="확대">+</button><button class="card" data-z="-1" title="축소">−</button><button class="card" data-z="0" title="맞춤">⟲</button></div>
    <div id="hint">드래그 이동 · 휠 확대 · 캐릭터 클릭</div>
  </div>
</main>
<aside id="right">
  <section><h2>사무실 사람들 <span id="count"></span></h2><div id="people"></div></section>
  <section><h2>활동 로그 <span>LOG</span></h2><div id="log" class="log"></div></section>
  <section><h2>어디서 무엇을 하나</h2><div id="legend" class="legend"></div></section>
</aside>
<script>
const $ = (id) => document.getElementById(id);

// ── 월드 좌표계: 16×12 타일, 2:1 아이소메트릭. 장면은 저해상도 캔버스에 그린 뒤 정수 배율로 키운다.
const W = 480, H = 320, OX = 208, OY = 74, TW = 32, TH = 16, WALL_H = 56;
const low = document.createElement('canvas'); low.width = W; low.height = H;
const lowCtx = low.getContext('2d');
const bg = document.createElement('canvas'); bg.width = W; bg.height = H;
const bgCtx = bg.getContext('2d');
const cv = $('c'), ctx = cv.getContext('2d');
let G = lowCtx;

const ROOMS = {
  library: { x: 0, y: 0, w: 6, h: 5, label: '자료실', icon: '📚', floor: ['#a0683f', '#8f5b36'], plank: true, desc: '파일 읽기 · 검색' },
  dev: { x: 6, y: 0, w: 10, h: 5, label: '개발실', icon: '💻', floor: ['#56647f', '#4d5a74'], desc: '코드 수정' },
  meeting: { x: 0, y: 5, w: 6, h: 4, label: '회의실', icon: '📋', floor: ['#7a4a7d', '#6d416f'], desc: '계획 · 할 일 · 서브에이전트 호출' },
  info: { x: 6, y: 5, w: 6, h: 4, label: '정보검색실', icon: '🌐', floor: ['#2b828b', '#257179'], desc: '웹 검색 · MCP 도구' },
  server: { x: 12, y: 5, w: 4, h: 4, label: '서버실', icon: '🗄️', floor: ['#333c57', '#232842'], grid: true, desc: '명령 실행 · git' },
  lounge: { x: 0, y: 9, w: 6, h: 3, label: '휴게실', icon: '☕', floor: ['#c86b4d', '#b85f43'], desc: '90초 넘게 쉬는 중' },
  desk: { x: 6, y: 9, w: 10, h: 3, label: '내 자리', icon: '🙋', floor: ['#d9a066', '#c98f58'], plank: true, desc: 'Claude가 나에게 질문할 때' },
};
// 방마다 캐릭터가 서는 자리
const SPOTS = {
  library: [[1.5, 1.15], [4.5, 1.15], [1.1, 2.7], [3.1, 3.9], [4.9, 3.0], [1.9, 4.3]],
  dev: [[7.9, 2.35], [9.9, 2.35], [11.9, 2.35], [13.9, 2.35], [7.9, 4.15], [9.9, 4.15], [11.9, 4.15], [13.9, 4.15]],
  meeting: [[2.6, 5.95], [3.9, 5.95], [1.3, 7.0], [2.6, 8.2], [3.9, 8.2], [5.1, 7.0]],
  info: [[7.45, 6.75], [8.85, 6.75], [10.25, 6.75], [7.6, 8.3], [9.0, 8.3], [10.3, 7.7]],
  server: [[13.0, 6.55], [14.0, 6.55], [15.0, 6.55], [13.4, 7.9], [14.6, 7.9], [15.0, 8.55]],
  lounge: [[1.6, 10.0], [3.2, 10.05], [4.8, 9.9], [2.4, 11.45], [4.0, 11.5], [5.3, 11.75], [0.9, 11.7]],
  desk: [[8.9, 11.45], [12.3, 11.3], [7.5, 10.4], [13.4, 10.5], [7.2, 11.6], [14.3, 11.5]],
};
const BACK_ROOMS = new Set(['dev', 'server', 'info', 'library']);
const SUB_ROOM = { Explore: 'library', Plan: 'meeting', 'general-purpose': 'dev', 'claude-code-guide': 'info' };
// 방 이름표 위치 (가구·캐릭터 자리를 피한 바닥 지점)
const LABEL_AT = { library: [1.4, 4.0], dev: [10.0, 0.75], meeting: [1.2, 8.4], info: [11.0, 6.95], server: [15.6, 6.3], lounge: [1.4, 10.6], desk: [7.6, 10.0] };
const ELEVATOR = [0.6, 10.45];
const ME_SPOT = [10.6, 11.15];

// ── 픽셀 도구
const shadeMemo = new Map();
function shade(hex, k) {
  const key = hex + k;
  if (!shadeMemo.has(key)) {
    const n = parseInt(hex.slice(1), 16);
    const f = (v) => Math.max(0, Math.min(255, Math.round(k < 1 ? v * k : v + (255 - v) * (k - 1))));
    shadeMemo.set(key, '#' + [n >> 16, (n >> 8) & 255, n & 255].map((v) => f(v).toString(16).padStart(2, '0')).join(''));
  }
  return shadeMemo.get(key);
}
function rng(seed) { let s = (seed * 9301 + 49297) % 233280 || 1; return () => (s = (s * 16807) % 2147483647) / 2147483647; }
const hash = (str) => [...str].reduce((a, ch) => (a * 31 + ch.charCodeAt(0)) >>> 0, 7);
const iso = (x, y, z = 0) => [(x - y) * TW / 2 + OX, (x + y) * TH / 2 - z + OY];

// 볼록 다각형을 행 단위로 채운다. 안티앨리어싱 없이 픽셀 경계가 딱 떨어진다.
function poly(pts, color) {
  G.fillStyle = color;
  let minY = Infinity, maxY = -Infinity;
  for (const p of pts) { if (p[1] < minY) minY = p[1]; if (p[1] > maxY) maxY = p[1]; }
  for (let y = Math.floor(minY); y < Math.ceil(maxY); y++) {
    const cy = y + 0.5;
    let l = Infinity, r = -Infinity;
    for (let i = 0; i < pts.length; i++) {
      const [x1, y1] = pts[i], [x2, y2] = pts[(i + 1) % pts.length];
      if ((cy < y1) === (cy < y2)) continue;
      const x = x1 + (cy - y1) * (x2 - x1) / (y2 - y1);
      if (x < l) l = x; if (x > r) r = x;
    }
    if (r <= l) continue;
    const L = Math.round(l), R = Math.round(r);
    if (R > L) G.fillRect(L, y, R - L, 1); else if (r - l > 0.2) G.fillRect(Math.floor(l), y, 1, 1);
  }
}
function seg(a, b, color) {
  G.fillStyle = color;
  let x0 = Math.round(a[0]), y0 = Math.round(a[1]);
  const x1 = Math.round(b[0]), y1 = Math.round(b[1]);
  const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
  let err = dx + dy;
  for (;;) {
    G.fillRect(x0, y0, 1, 1);
    if (x0 === x1 && y0 === y1) break;
    const e2 = 2 * err;
    if (e2 >= dy) { err += dy; x0 += sx; }
    if (e2 <= dx) { err += dx; y0 += sy; }
  }
}
const dot = (x, y, z, color) => { const [px, py] = iso(x, y, z); G.fillStyle = color; G.fillRect(Math.round(px), Math.round(py), 1, 1); };
const quad = (x, y, w, d, z, color) => poly([iso(x, y, z), iso(x + w, y, z), iso(x + w, y + d, z), iso(x, y + d, z)], color);
const faceY = (y, x1, x2, z1, z2, color) => poly([iso(x1, y, z2), iso(x2, y, z2), iso(x2, y, z1), iso(x1, y, z1)], color);
const faceX = (x, y1, y2, z1, z2, color) => poly([iso(x, y1, z2), iso(x, y2, z2), iso(x, y2, z1), iso(x, y1, z1)], color);

// 직육면체: 윗면, +y면(왼쪽 아래를 향함), +x면(오른쪽 아래를 향함)이 보인다.
function box(x, y, z, w, d, h, color, o = {}) {
  poly([iso(x, y + d, z + h), iso(x + w, y + d, z + h), iso(x + w, y + d, z), iso(x, y + d, z)], o.left || shade(color, 0.78));
  poly([iso(x + w, y, z + h), iso(x + w, y + d, z + h), iso(x + w, y + d, z), iso(x + w, y, z)], o.right || shade(color, 0.6));
  poly([iso(x, y, z + h), iso(x + w, y, z + h), iso(x + w, y + d, z + h), iso(x, y + d, z + h)], o.top || color);
  if (o.edge !== false && w > 0.2 && d > 0.2) {
    const hi = o.hi || shade(color, 1.22);
    seg(iso(x, y + d, z + h), iso(x + w, y + d, z + h), hi);
    seg(iso(x + w, y, z + h), iso(x + w, y + d, z + h), hi);
  }
}
function table(x, y, w, d, h, color) {
  const lw = 0.1, leg = shade(color, 0.62);
  for (const [lx, ly] of [[x, y], [x + w - lw, y], [x, y + d - lw], [x + w - lw, y + d - lw]]) box(lx, ly, 0, lw, lw, h - 3, leg, { edge: false });
  box(x, y, h - 3, w, d, 3, color);
}
function chair(x, y, color) {
  box(x + 0.2, y + 0.18, 0, 0.1, 0.1, 6, '#1a1c2c', { edge: false });
  box(x, y, 6, 0.5, 0.45, 2, color);
  box(x, y + 0.38, 8, 0.5, 0.08, 8, shade(color, 0.9), { edge: false });
}
function spriteFrom(rows, colors) {
  const c = document.createElement('canvas');
  c.width = Math.max(...rows.map((r) => r.length)); c.height = rows.length;
  const x = c.getContext('2d');
  rows.forEach((r, j) => [...r].forEach((ch, i) => { if (colors[ch]) { x.fillStyle = colors[ch]; x.fillRect(i, j, 1, 1); } }));
  return c;
}
const LEAF = spriteFrom([
  '.....ll......',
  '...lgGGl.l...',
  '..gGGGGlGGg..',
  '.gGGgGGGGGGg.',
  'gGGlGGGgGlGGg',
  'gGGGGGlGGGGGg',
  '.gGgGGGGGgGg.',
  '.ggGGGgGGGgg.',
  '...ggGGGgg...',
], { l: '#a7f070', G: '#38b764', g: '#257147' });
function plant(x, y) {
  box(x - 0.15, y - 0.15, 0, 0.3, 0.3, 7, '#b86f50', { edge: false });
  const [px, py] = iso(x, y, 7);
  G.drawImage(LEAF, Math.round(px) - 6, Math.round(py) - 8);
}

// ── 캐릭터 스프라이트 (10×16)
const BODY = [
  '...oooo...',
  '..ohhhho..',
  '.ohhhhhho.',
  '.ohhsshho.',
  '.osesseso.',
  '.osssssso.',
  '..oossoo..',
  '.oCccccCo.',
  'oCccccccCo',
  'occcccccco',
  'osccccccso',
  '.oppppppo.',
];
const LEGS = [
  ['.oppoopPo.', '.opo..opo.', '.obo..obo.', '.ooo..ooo.'],
  ['.oppoopPo.', '.opo..opo.', '.ooo..obo.', '......ooo.'],
  ['.oppoopPo.', '.opo..opo.', '.obo..ooo.', '.ooo......'],
];
const spriteMemo = new Map();
function sprite(pal, frame, back) {
  const key = `${pal.shirt}${pal.hair}${pal.skin}${pal.hat || ''}${pal.glasses ? 1 : 0}${frame}${back ? 1 : 0}`;
  if (!spriteMemo.has(key)) {
    const rows = BODY.slice();
    if (back) rows[3] = rows[4] = rows[5] = '.ohhhhhho.';

const CLAWD = ['...XXXXXXXXXXXX...', '...XXeXXXXXXeXX...', '.XXXXXXXXXXXXXXXX.', '...DDDDDDDDDDDD...'];
const CLAWD_LEGS = [
  ['....D.D....D.D....', '....D.D....D.D....'],
  ['....D.D....D.D....', '...........D.D....'],
  ['....D.D....D.D....', '....D.D...........'],

function claudeSprite(frame) {
  const key = `clawd${frame}`;
  if (!spriteMemo.has(key)) {
    const rows = [...CLAWD.flatMap((r) => [r, r]), ...CLAWD_LEGS[frame]];
    const COL = { X: '#d77757', D: '#b8603f', e: '#1a1c2c' };
    let grid = Array.from({ length: rows.length + 4 }, (_, j) => Array.from({ length: 22 }, (_, i) => COL[(rows[j - 2] || '')[i - 2]] || null));
    const ring = (src, color) => src.map((row, j) => row.map((c, i) => c || ([[1, 0], [-1, 0], [0, 1], [0, -1]].some(([dx, dy]) => src[j + dy] && src[j + dy][i + dx]) ? color : null)));
    grid = ring(ring(grid, '#1a1c2c'), '#ffffff');
    const c = document.createElement('canvas'); c.width = 22; c.height = grid.length;
    const x = c.getContext('2d');
    grid.forEach((row, j) => row.forEach((col, i) => { if (col) { x.fillStyle = col; x.fillRect(i, j, 1, 1); } }));
    spriteMemo.set(key, c);
  }
  return spriteMemo.get(key);
}

  if (!id || id === sel) return;
  const up = (floorNo(id) || 0) >= (floorNo(sel) || 0);
  $('doorLcd').textContent = `${up ? '▲' : '▼'} ${floorNo(id)}F`;
  $('doors').classList.add('closed');
  setTimeout(() => { sel = id; hl = null; for (const k of [...actors.keys()]) if (k !== 'me') actors.delete(k); render(true); }, 380);
  setTimeout(() => $('doors').classList.remove('closed'), 760);
}
function highlight(id) { hl = hl === id ? null : id; $('people')._html = $('floorList')._html = null; render(false); }

$('floorList').addEventListener('pointerdown', (e) => {
  const s = e.target.closest('[data-sid]'); if (s) return highlight(s.dataset.sid);
  const b = e.target.closest('.floor'); if (b) switchFloor(b.dataset.id);
});
$('people').addEventListener('pointerdown', (e) => { const p = e.target.closest('[data-sid]'); if (p) highlight(p.dataset.sid); });
$('legend').innerHTML = Object.values(ROOMS).map((R) => `<i style="background:${R.floor[0]}"></i><span><b>${R.icon} ${R.label}</b>${R.desc}</span>`).join('')
  + '<i style="background:#94b0c2"></i><span><b>🛗 엘리베이터</b>서브에이전트 출근 · 보고 후 퇴근</span>';
$('logo').src = CLAUDE_AVATAR();

// ── 캔버스 크기, 드래그, 확대
const stage = $('stage');
new ResizeObserver(() => { cv.width = Math.round(stage.clientWidth * DPR()); cv.height = Math.round(stage.clientHeight * DPR()); }).observe(stage);
function actorAt(mx, my) {
  const { k, bx, by } = layout();
  let best = null;
  for (const a of actors.values()) {
    const [px, py] = iso(a.x, a.y), x = bx + px * k, y = by + py * k;
    const main = a.kind === 'main', hw = main ? 12 : 6, top = main ? 15 + floatOf(a, performance.now()) : 17;
    if (!(mx > x - hw * k && mx < x + hw * k && my > y - top * k && my < y + 2 * k)) continue;
    if (!best || (main && best.kind !== 'main') || (main === (best.kind === 'main') && a.x + a.y > best.x + best.y)) best = a;
  }
  return best;
}
let drag = null;
stage.addEventListener('pointerdown', (e) => {
  if (e.target !== cv) return;
  drag = { x: e.clientX, y: e.clientY, px: view.panX, py: view.panY, moved: false };
  stage.setPointerCapture(e.pointerId);
});
stage.addEventListener('pointermove', (e) => {
  const r = cv.getBoundingClientRect(), mx = (e.clientX - r.left) * DPR(), my = (e.clientY - r.top) * DPR();
  if (drag) {
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (Math.abs(dx) + Math.abs(dy) > 3) { drag.moved = true; stage.classList.add('drag'); }
    view.panX = drag.px + dx * DPR(); view.panY = drag.py + dy * DPR();
  }
  const a = !drag && actorAt(mx, my), tip = $('tip');
  if (!a) { tip.style.display = 'none'; cv.style.cursor = ''; return; }
  cv.style.cursor = 'pointer';
  const R = ROOMS[a.room] || {};
  tip.innerHTML = a.kind === 'me' ? '<b>나</b><small>Claude가 질문하면 이 자리로 찾아옵니다.</small>'
    : a.kind === 'sub' ? `<b>🛗 ${esc(a.sub.type)}</b><small>${esc(a.sub.desc || '서브에이전트')} · ${esc(R.label || '')}</small>`
    : `<b>${esc(a.s.title)}</b><small>${esc(R.icon || '')} ${esc(R.label || '')} · ${ago(a.s.last)}</small><small>${esc(a.s.idle ? '대기 중' : a.s.bubble ? a.s.bubble.text : '')}</small>`;
  tip.style.display = 'block';
  tip.style.left = `${Math.min(e.clientX - r.left + 14, r.width - tip.offsetWidth - 8)}px`;
  tip.style.top = `${Math.max(8, e.clientY - r.top - tip.offsetHeight - 10)}px`;
});
stage.addEventListener('pointerup', (e) => {
  if (drag && !drag.moved) {
    const r = cv.getBoundingClientRect(), a = actorAt((e.clientX - r.left) * DPR(), (e.clientY - r.top) * DPR());
    if (a && a.kind === 'main') highlight(a.s.id); else if (a && a.kind === 'me') highlight('me');
  }
  drag = null; stage.classList.remove('drag');
});
stage.addEventListener('pointerleave', () => { $('tip').style.display = 'none'; });
function zoomTo(k, mx = cv.width / 2, my = cv.height / 2) {
  const cur = layout(); k = Math.max(1, Math.min(12, k));
  if (k === cur.k) return;
  const wx = (mx - cur.bx) / cur.k, wy = (my - cur.by) / cur.k;
  view.k = k;
  view.panX = mx - wx * k - (cv.width - W * k) / 2;
  view.panY = my - wy * k - (cv.height - H * k) / 2;
}
let wheelLock = 0;
stage.addEventListener('wheel', (e) => {
  e.preventDefault();
  if (performance.now() < wheelLock) return;
  wheelLock = performance.now() + 120;
  const r = cv.getBoundingClientRect();
  zoomTo(layout().k + (e.deltaY < 0 ? 1 : -1), (e.clientX - r.left) * DPR(), (e.clientY - r.top) * DPR());
}, { passive: false });
$('zoom').addEventListener('click', (e) => {
  const z = e.target.closest('button'); if (!z) return;
  if (z.dataset.z === '0') Object.assign(view, { k: null, panX: 0, panY: 0 });
  else zoomTo(layout().k + Number(z.dataset.z));
});

// ── 시작
buildFurniture();
Promise.all([document.fonts.load('12px "Pretendard Variable"'), document.fonts.load('9px Galmuri9')]).finally(() => { drawBackground(); requestAnimationFrame(loop); });
const es = new EventSource('/events');
es.onopen = () => { $('live').className = ''; $('live').lastChild.textContent = 'LIVE'; };
es.onerror = () => { $('live').className = 'off'; $('live').lastChild.textContent = 'OFFLINE'; };
es.onmessage = (e) => { snap = JSON.parse(e.data); render(first); first = false; };
</script>
</body>
